[app]
app_server ansible_host=127.0.0.1 ansible_port=2222

[db]
db_server ansible_host=127.0.0.1 ansible_port=2223

[all:vars]
ansible_user=root
ansible_connection=ssh
ansible_ssh_private_key_file=~/.ssh/alu-devops
ansible_python_interpreter=/usr/bin/python3

db_private_ip=172.19.0.3
app_private_ip=172.19.0.2

app_port=8080
app_image=aziza20/campus-event-notifier:v1
docker_network=campus-notifier-network